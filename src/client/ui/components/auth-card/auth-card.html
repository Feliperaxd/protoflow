
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.page { min-height: 520px; display: flex; align-items: center; justify-content: center; padding: 2rem; background: #E1F5EE; }
.scene { width: 100%; max-width: 400px; height: 500px; perspective: 1000px; }
.card-3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.4,0,0.2,1); }
.card-3d.flipped { transform: rotateY(180deg); }
.face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 2rem; display: flex; flex-direction: column; }
.face--back { transform: rotateY(180deg); }
.card__title { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
.card__subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field__label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.02em; }
.field__input { height: 38px; border: 0.5px solid #9FE1CB; border-radius: var(--border-radius-md); padding: 0 12px; font-size: 14px; color: var(--color-text-primary); background: var(--color-background-secondary); width: 100%; outline: none; transition: border-color 0.15s, background 0.15s; }
.field__input:focus { border-color: #1D9E75; background: var(--color-background-primary); box-shadow: 0 0 0 3px #E1F5EE; }
.field__input::placeholder { color: var(--color-text-tertiary); }
.row { display: flex; align-items: center; gap: 10px; margin-top: 1.25rem; }
.btn--filled { height: 38px; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; padding: 0 24px; background: #1D9E75; color: #fff; border: none; flex: 1; transition: opacity 0.15s; }
.btn--filled:hover { opacity: 0.88; }
.btn--outlined { height: 38px; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; padding: 0 16px; background: transparent; color: #185FA5; border: 0.5px solid #185FA5; white-space: nowrap; transition: background 0.15s; }
.btn--outlined:hover { background: #E6F1FB; }
.btn--link { background: none; border: none; color: #185FA5; font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; font-weight: 500; }
.google-btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; background: transparent; color: var(--color-text-primary); border: 0.5px solid var(--color-border-secondary); width: 100%; margin-top: 10px; transition: background 0.15s; }
.google-btn:hover { background: var(--color-background-secondary); }
.divider { display: flex; align-items: center; gap: 12px; margin: 14px 0; }
.divider__line { flex: 1; height: 0.5px; background: #9FE1CB; }
.divider__text { font-size: 12px; color: var(--color-text-tertiary); }
.footer { text-align: center; margin-top: 1rem; font-size: 13px; color: var(--color-text-secondary); }
.footer button { background: none; border: none; color: #1D9E75; font-size: 13px; cursor: pointer; font-weight: 500; text-decoration: underline; }
</style>

<div class="page">
  <div class="scene">
    <div class="card-3d" id="card">

      <div class="face face--front">
        <p class="card__title">Bem-vindo de volta</p>
        <p class="card__subtitle">Entre na sua conta para continuar</p>

        <div class="field">
          <label class="field__label">E-mail</label>
          <input class="field__input" type="email" placeholder="seu@email.com">
        </div>

        <div class="field">
          <label class="field__label">Senha</label>
          <input class="field__input" type="password" placeholder="••••••••">
        </div>

        <div class="row">
          <button class="btn--outlined">Esqueci a senha</button>
          <button class="btn--filled">Login</button>
        </div>

        <div class="divider">
          <div class="divider__line"></div>
          <span class="divider__text">ou</span>
          <div class="divider__line"></div>
        </div>

        <button class="google-btn">
          <i class="ti ti-brand-google" style="font-size:16px;" aria-hidden="true"></i>
          Continuar com Google
        </button>

        <div class="footer">
          Não tem uma conta? <button onclick="document.getElementById('card').classList.add('flipped')">Cadastre-se</button>
        </div>
      </div>

      <div class="face face--back">
        <p class="card__title">Criar conta</p>
        <p class="card__subtitle">Preencha os dados para se cadastrar</p>

        <div class="field">
          <label class="field__label">E-mail</label>
          <input class="field__input" type="email" placeholder="seu@email.com">
        </div>

        <div class="field">
          <label class="field__label">Senha</label>
          <input class="field__input" type="password" placeholder="••••••••">
        </div>

        <div class="field">
          <label class="field__label">Repetir senha</label>
          <input class="field__input" type="password" placeholder="••••••••">
        </div>

        <div class="row">
          <button class="btn--outlined" onclick="document.getElementById('card').classList.remove('flipped')">Já tenho conta</button>
          <button class="btn--filled">Cadastrar</button>
        </div>
      </div>

    </div>
  </div>
</div>
