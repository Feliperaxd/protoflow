<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../../../styles/tokens.css" />
  <link rel="stylesheet" href="../../../../styles/globals.css" />
  <link rel="stylesheet" href="../../../../styles/icon-mask.css" />
  <link rel="stylesheet" href="../range-slider.css" />

  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1C1C1C;
    }
  </style>
</head>
<body>
  <div
    class="range-slider"
    id="range-slider-example"
    style="--default-value:25; --symbol:%; --step-value:5; --min-value:5; --max-value:100;"
  >
    <div class="range-slider__header">
      <p class="range-slider__title" responsive-text>Preenchimento</p>
    </div>
    <div class="range-slider__body">
      <div class="range-slider__track">
        <div class="range-slider__filled"></div>
        <div class="range-slider__thumb"></div>
      </div>
      <p class="range-slider__value" responsive-text></p>
    </div>
  </div>

  <script type="module" src="./range-slider.test.js"></script>
</body>
</html>
