<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="../../../styles/globals.css">
  <link rel="stylesheet" href="../styles/register-card.css">
</head>
<body class="container">

  <div class="register-card">

    <div class="register-card__header">
      <h1 class="register-card__title">Cadastro</h1>
    </div>

    <div class="register-card__body">
      <form class="register-form" id="register-form" novalidate>

        <div class="field">
          <label class="field__label" for="name">Nome completo</label>
          <input class="field__input" type="text" id="name" name="name" placeholder="João da Silva" autocomplete="name">
        </div>

        <div class="field">
          <label class="field__label" for="phone">Telefone</label>
          <input class="field__input" type="tel" id="phone" name="phone" placeholder="(11) 99999-9999" autocomplete="tel">
        </div>

        <div class="field">
          <label class="field__label" for="email">E-mail</label>
          <input class="field__input" type="email" id="email" name="email" placeholder="joao@exemplo.com" autocomplete="email">
        </div>

        <div class="field">
          <label class="field__label" for="password">Senha</label>
          <input class="field__input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password">
        </div>

        <div class="field">
          <span class="field__label">Tipo de documento</span>
          <div class="document__type">
            <label class="doc-option__label">
              <input class="doc-option__input" type="radio" name="document_type" value="cpf" checked>
              CPF
            </label>
            <label class="doc-option__label">
              <input class="doc-option__input" type="radio" name="document_type" value="cnpj">
              CNPJ
            </label>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="document_number">Número do documento</label>
          <input class="field__input" type="text" id="document_number" name="document_number" placeholder="000.000.000-00" inputmode="numeric">
        </div>

        <div class="register-form__footer">
          <button class="register-form__submit" type="submit">Criar conta</button>
        </div>

      </form>
    </div>

  </div>

  <script type="module" src="../scripts/register-card.js"></script>
</body>
</html>
